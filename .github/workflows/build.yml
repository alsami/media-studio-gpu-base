name: build

# Builds the base image. A pull request builds it without pushing (the build is the check); main and a run by hand push
# ghcr.io/alsami/media-studio-gpu-base:sha-<12> and :latest and print the digest in the job summary. The private
# repository pins that digest, never a tag.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - base/**
      - runners/**
      - .github/workflows/build.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/alsami/media-studio-gpu-base
  CACHE: ghcr.io/alsami/media-studio-gpu-base-cache:layers

jobs:
  build:
    runs-on: ubuntu-latest
    # torch twice with the CUDA libraries is a long pull and a long export.
    timeout-minutes: 180
    # A build of main is never cancelled (a half-pushed cache is wasted hours); a newer push to a pull request
    # replaces its older run.
    concurrency:
      group: build-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # The runner has about 14 GB free; the image's layers, the builder's copy and the cache need more. These
      # folders are tools this build does not use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v3

      # A pull request from a fork has a read-only token and no login; its build reads the public cache only.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short commit
        id: short
        run: echo "sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.short.outputs.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            BASE_COMMIT=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.CACHE }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0},mode=max', env.CACHE) || '' }}
          # One plain manifest, so the digest is that of the image and nothing else.
          provenance: false
          sbom: false

      - name: Disk after the build
        if: always()
        run: df -h /

      - name: Digest
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## Base image digest"
            echo
            echo '```'
            echo "${IMAGE}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Pin this in the private repository's Dockerfile. Tags: \`sha-${GITHUB_SHA:0:12}\`, \`latest\`."
          } >> "$GITHUB_STEP_SUMMARY"
